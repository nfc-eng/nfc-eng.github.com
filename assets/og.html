<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;600&family=Newsreader:opsz,wght@6..72,500;6..72,600&display=swap">
<style>
  html, body { margin: 0; width: 1200px; height: 630px; background: #f4f5f2; color: #16211d; }
  .wrap {
    box-sizing: border-box;
    height: 630px;
    padding: 72px 80px 56px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    font-family: "Hanken Grotesk", sans-serif;
  }
  .word {
    font-family: "Newsreader", Georgia, serif;
    font-weight: 600;
    font-size: 42px;
    letter-spacing: -0.025em;
    line-height: 1;
  }
  h1 {
    margin: 28px 0 0;
    font-family: "Newsreader", Georgia, serif;
    font-weight: 500;
    font-size: 68px;
    line-height: 1.08;
    letter-spacing: -0.025em;
    max-width: 16ch;
  }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    border-top: 2px solid #16211d;
    padding-top: 22px;
    font-size: 26px;
    color: #56635d;
  }
  footer strong { color: #16211d; font-weight: 600; }
</style>
</head>
<body>
  <div class="wrap">
    <div>
      <div class="word">Nicholas Clement</div>
      <h1>I build side projects and write down what I learn.</h1>
    </div>
    <footer>
      <span>Projects, notes from 2020, and a short bio.</span>
      <strong>Software engineer</strong>
    </footer>
  </div>
</body>
</html>
